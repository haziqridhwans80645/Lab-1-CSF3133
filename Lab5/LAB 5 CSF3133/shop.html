<head>

<title>Campus Bookstore</title>

<!-- Link two Google Fonts: Roboto for general text, Merriweather for headings -->
<link href="https://fonts.googleapis.com/css?family=Merriweather:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css">
</head>
<body>

    <!-- Header Section with Background Image -->
    <header>
        <h1>Campus Bookstore</h1>
    </header>

    <!-- Navigation Bar -->
    <nav>
        <ul>
            <li><a class="active" href="#home">Home</a></li>
            <li><a href="#books">Books</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main>
        <p>Textbooks, stationery and more for every student.</p>
        
        <table id="product">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th class="price-col">Price (RM)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Web Design Basics</td>
                    <td>Textbook</td>
                    <td class="price-col">45.00</td>
                </tr>
                <tr>
                    <td>A4 Notebook</td>
                    <td>Stationery</td>
                    <td class="price-col">6.50</td>
                </tr>
                <tr>
                    <td>USB Drive 32GB</td>
                    <td>Gadget</td>
                    <td class="price-col">25.00</td>
                </tr>
                <tr>
                    <td>Highlighter Set</td>
                    <td>Stationery</td>
                    <td class="price-col">9.90</td>
                </tr>
            </tbody>
        </table>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Campus Bookstore</p>
    </footer>

</body>
